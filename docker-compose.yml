# ---------------------------------------------------------------
# Persian Speech-to-Text — Docker Compose
#
# Usage:
#   1. Copy .env.example to .env and add your GOOGLE_API_KEY
#   2. docker compose up --build
#   3. Open http://localhost:8501
# ---------------------------------------------------------------

services:
  speech-to-text:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: speech-to-text
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://0.0.0.0:8501/_stcore/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s